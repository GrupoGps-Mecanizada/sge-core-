<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SGE Core · exemplo</title>
    <link rel="icon" href="v1/assets/sge-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="v1/sge-core.css">
    <style>
        body { margin: 0; }
        .topo { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--sge-marca-escura); color: #fff; }
        .topo img { height: 32px; }
        main { max-width: 860px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
        .linha { display: flex; flex-wrap: wrap; gap: 8px; }
        h1 { font-size: 18px; margin: 0; }
        h2 { font-size: 16px; margin: 0 0 12px; }
    </style>
</head>
<body class="sge">
    <header class="topo">
        <img id="logo" alt="SGE">
        <h1>SGE Core v1 · página de exemplo (dados falsos)</h1>
    </header>

    <main>
        <section class="sge-cartao">
            <h2>Avisos</h2>
            <div class="linha">
                <button class="sge-btn" onclick="SGE.aviso('Registro salvo.', 'sucesso')">Sucesso</button>
                <button class="sge-btn sge-btn--secundario" onclick="SGE.aviso('Confira a data do turno.', 'alerta')">Alerta</button>
                <button class="sge-btn sge-btn--perigo" onclick="SGE.erro({ code: '42501', message: 'permission denied' }, 'exemplo')">Erro de permissão</button>
                <button class="sge-btn sge-btn--secundario" onclick="testarCarregando()">Carregando 2s</button>
            </div>
        </section>

        <section class="sge-cartao">
            <h2>Formulário que não perde o que foi digitado</h2>
            <form id="exemplo-form" onsubmit="event.preventDefault(); SGE.aviso('Enviado (exemplo).', 'sucesso'); this.reset();">
                <div class="sge-campo">
                    <label for="f-nome">Nome</label>
                    <input class="sge-input" id="f-nome" name="nome" placeholder="Ex.: Maria Teste">
                </div>
                <div class="sge-campo">
                    <label for="f-setor">Setor</label>
                    <select class="sge-select" id="f-setor" name="setor">
                        <option>Mecanizada</option><option>Manutenção</option><option>Logística</option>
                    </select>
                </div>
                <button class="sge-btn sge-btn--bloco">Enviar</button>
            </form>
        </section>

        <section class="sge-cartao">
            <h2>Tabela e formatos brasileiros</h2>
            <div class="sge-tabela-caixa">
                <table class="sge-tabela">
                    <thead><tr><th>Colaborador</th><th>Data</th><th>Horas</th><th>Valor</th></tr></thead>
                    <tbody id="tabela"></tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="v1/sge-core.js"></script>
    <script>
        document.getElementById('logo').src = 'v1/assets/sge-logo.svg';
        SGE.rascunho.ligar(document.getElementById('exemplo-form'));

        const falsos = [
            { nome: 'Colaborador A', data: '2026-10-01T07:00:00-03:00', horas: 8.5, valor: 312.4 },
            { nome: 'Colaborador B', data: '2026-10-02T19:00:00-03:00', horas: 12, valor: 480 },
        ];
        const corpo = document.getElementById('tabela');
        falsos.forEach((l) => {
            const tr = document.createElement('tr');
            [l.nome, SGE.formatar.data(l.data), SGE.formatar.numero(l.horas, 1), SGE.formatar.moeda(l.valor)]
                .forEach((v) => { const td = document.createElement('td'); td.textContent = v; tr.appendChild(td); });
            corpo.appendChild(tr);
        });

        function testarCarregando() {
            SGE.seguro(() => new Promise((ok) => setTimeout(ok, 2000)), { texto: 'Buscando dados...', sucesso: 'Pronto!' });
        }
    </script>
</body>
</html>
